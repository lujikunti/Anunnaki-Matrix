<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020f22"><title>Referral Exchange | Anunnaki Matrix</title>
<style>
:root{--navy:#020f22;--gold:#d8b45b;--blue:#49bff4;--white:#f7f8fb;--muted:#a9b7ca;--line:rgba(216,180,91,.28);--red:#d97168}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 12%,#0a3154 0,#061a32 25%,var(--navy) 58%);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}.wrap{width:min(1100px,90%);margin:auto}
nav{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}a{color:inherit}.brand{letter-spacing:.25em;font-weight:650;font-size:.88rem;text-decoration:none}.brand span,.k{color:var(--gold)}
.hero{padding:62px 0 28px}.hero h1{font-size:clamp(3rem,7vw,6rem);line-height:.9;letter-spacing:-.055em;margin:.25em 0}.hero p{color:var(--muted);max-width:650px}
.panel,.card{border:1px solid var(--line);background:rgba(255,255,255,.018)}.panel{padding:20px;margin:14px 0}.login{display:grid;grid-template-columns:1fr auto;gap:8px}.login input,.card textarea{border:1px solid var(--line);background:#041326;color:var(--white);padding:11px;font:inherit}
button{border:1px solid var(--gold);background:transparent;color:var(--gold);padding:11px 13px;font-weight:750;cursor:pointer}.primary{background:var(--gold);color:#06101f}.status{border-left:4px solid var(--gold);padding:10px 12px;background:rgba(255,255,255,.035);color:var(--muted);margin-top:8px}.status.ok{border-color:var(--blue)}.status.error{border-color:var(--red)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.list{display:grid;gap:10px;margin:12px 0 70px}.card{padding:16px;display:grid;grid-template-columns:1fr 240px;gap:14px}.card h2{font-size:1.55rem;margin:5px 0}.meta{color:var(--muted);font-size:.82rem}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}.chip{border:1px solid var(--line);padding:5px 7px;font-size:.72rem;text-transform:uppercase}.context{margin-top:9px}.context div{border-top:1px solid var(--line);padding:8px 0}.context b{display:block;color:var(--gold);font-size:.72rem;text-transform:uppercase}.card textarea{width:100%;min-height:84px}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.actions button{padding:8px 9px;font-size:.72rem}[hidden]{display:none!important}
@media(max-width:720px){.login,.card{grid-template-columns:1fr}.card aside{width:auto}}
</style>
</head>
<body>
<header class="wrap"><nav><a class="brand" href="/">ANUNNAKI <span>MATRIX</span></a><a href="/">Home</a></nav></header>
<main class="wrap">
<section class="hero"><div class="k">ANK REFERRAL EXCHANGE</div><h1>Warm introductions.<br>Context intact.</h1><p>Private reviewer room for founder-approved referrals arriving from The General Counsel.</p></section>
<section id="auth" class="panel"><div class="k">REVIEWER SIGN-IN</div><form id="login" class="login"><input id="email" type="email" autocomplete="email" placeholder="founder@anunnaki.live" required><button class="primary">SEND MAGIC LINK</button></form><div id="authStatus" class="status">Authorised Anunnaki reviewer account required.</div></section>
<section id="work" hidden>
 <div class="panel toolbar"><div><div class="k">TO ANUNNAKI</div><strong id="identity"></strong></div><div><button id="refresh">REFRESH</button> <button id="logout">SIGN OUT</button></div></div>
 <div id="workStatus" class="status">Loading referrals…</div><div id="list" class="list"></div>
</section>
</main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';
const SB='https://tofojlyfitqgophbyzyc.supabase.co',KEY='sb_publishable_fuuhwxcpGf2CPFyUiL_VmQ_fx3HSbf2',END=SB+'/functions/v1/ank-partner-referral';
const sb=createClient(SB,KEY),auth=document.getElementById('auth'),work=document.getElementById('work'),list=document.getElementById('list'),ws=document.getElementById('workStatus');let session=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show=(n,m,k='')=>{n.textContent=m;n.className='status '+k};
async function call(body){if(!session)throw new Error('Sign in required.');const r=await fetch(END,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+session.access_token,'apikey':KEY},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Request failed');return d}
async function load(){show(ws,'Loading referrals…');try{const d=await call({action:'inbox',target_product:'ANUNNAKI'});list.innerHTML='';if(!d.referrals.length){list.innerHTML='<div class="panel">No inbound founder referrals yet.</div>'}for(const x of d.referrals){const a=document.createElement('article');a.className='card';const ctx=Object.entries(x.approved_context||{}).map(([k,v])=>'<div><b>'+esc(k.replaceAll('_',' '))+'</b>'+esc(v)+'</div>').join('');a.innerHTML='<div><div class="k">GC → ANUNNAKI · '+esc(x.referral_type.replaceAll('_',' '))+'</div><h2>'+esc(x.company_name)+'</h2><div class="meta">'+esc(x.founder_name)+' · '+esc(x.founder_email)+' · '+esc(x.jurisdiction||'Jurisdiction not supplied')+' · '+new Date(x.created_at).toLocaleString()+'</div><div class="chips"><span class="chip">'+esc(x.status)+'</span>'+(x.requested_outcomes||[]).map(v=>'<span class="chip">'+esc(v.replaceAll('_',' '))+'</span>').join('')+'</div><div class="context">'+ctx+'</div><div class="meta"><b>Consent:</b> '+esc(x.consent_scope)+'</div></div><aside><textarea placeholder="Referral note">'+esc(x.target_note||'')+'</textarea><div class="actions"><button data-s="ACCEPTED">ACCEPT</button><button data-s="IN_PROGRESS">IN PROGRESS</button><button data-s="DECLINED">DECLINE</button><button data-s="CLOSED">CLOSE</button></div></aside>';a.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await call({action:'update',target_product:'ANUNNAKI',referral_id:x.id,status:b.dataset.s,target_note:a.querySelector('textarea').value.trim()});await load()}catch(e){show(ws,e.message,'error')}finally{b.disabled=false}});list.appendChild(a)}show(ws,d.referrals.length+' referral'+(d.referrals.length===1?'':'s')+' loaded.','ok')}catch(e){list.innerHTML='';show(ws,e.message,'error')}}
async function sync(){session=(await sb.auth.getSession()).data.session;auth.hidden=!!session;work.hidden=!session;if(session){document.getElementById('identity').textContent=session.user.email||'SIGNED IN';await load()}}
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const s=document.getElementById('authStatus');try{const {error}=await sb.auth.signInWithOtp({email:document.getElementById('email').value.trim(),options:{emailRedirectTo:location.href.split('#')[0]}});if(error)throw error;show(s,'Magic link sent. Check your email.','ok')}catch(err){show(s,err.message,'error')}};
document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();session=null;sync()};sb.auth.onAuthStateChange(()=>setTimeout(sync,0));sync();
</script>
</body></html>
