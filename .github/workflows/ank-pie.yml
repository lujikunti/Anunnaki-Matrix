name: ANK PIE

on:
  pull_request:
    paths:
      - 'packages/ank-pie/**'
      - '.github/workflows/ank-pie.yml'
  push:
    branches: [main]
    paths:
      - 'packages/ank-pie/**'
      - '.github/workflows/ank-pie.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ank-pie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
