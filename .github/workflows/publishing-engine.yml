name: ANK Publishing Engine

on:
  pull_request:
    paths:
      - 'packages/publishing-engine/**'
      - '.github/workflows/publishing-engine.yml'
  push:
    branches: [main]
    paths:
      - 'packages/publishing-engine/**'
      - '.github/workflows/publishing-engine.yml'

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run engine red-team tests
        run: node --test packages/publishing-engine/tests/*.test.mjs
